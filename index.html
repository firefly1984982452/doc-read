<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>丹的阅读笔记</title>
  <meta name="description" content="一座持续生长的个人阅读档案，记录文学、历史、哲学与生活类书籍的阅读笔记。">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#8b22e8">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://firefly1984982452.github.io/doc-read/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:title" content="丹的阅读笔记">
  <meta property="og:description" content="上有天堂，下有书房。记录每一本认真读过的书。">
  <meta property="og:url" content="https://firefly1984982452.github.io/doc-read/">
  <meta property="og:image" content="https://firefly1984982452.github.io/doc-read/assets/images/cover.svg">
  <link rel="icon" href="./assets/images/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="./site.webmanifest">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <link rel="stylesheet" href="./assets/css/blog.css">
  <script>
    (function () {
      var savedTheme = localStorage.getItem('doc-read-theme');
      var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = savedTheme || (systemDark ? 'dark' : 'light');
    }());
  </script>
</head>

<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <div id="reading-progress" aria-hidden="true"></div>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换深浅色主题" title="切换深浅色主题">
    <span aria-hidden="true">◐</span>
  </button>
  <div id="app">正在打开书房…</div>
  <noscript>这个网站需要启用 JavaScript 才能浏览阅读笔记。</noscript>

  <script src="./assets/js/search-paths.js"></script>
  <script src="./assets/js/reading-data.js"></script>
  <script>
    window.$docsify = {
      name: '丹的阅读笔记',
      nameLink: '#/',
      repo: 'https://github.com/firefly1984982452/doc-read',
      noEmoji: false,
      coverpage: true,
      onlyCover: false,
      loadSidebar: true,
      loadNavbar: true,
      mergeNavbar: true,
      subMaxLevel: 3,
      maxLevel: 4,
      auto2top: true,
      autoHeader: false,
      relativePath: false,
      notFoundPage: '404.md',
      topMargin: 32,
      search: {
        paths: window.DOC_READ_SEARCH_PATHS || 'auto',
        placeholder: '搜索书名、作者或笔记内容',
        noData: '没有找到相关内容',
        depth: 4,
        hideOtherSidebarContent: true,
        namespace: 'doc-read-v2'
      },
      count: {
        countable: true,
        fontsize: '0.82em',
        color: 'var(--text-muted)',
        language: 'chinese'
      },
      pagination: {
        previousText: '上一篇',
        nextText: '下一篇',
        crossChapter: true
      },
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            var articleTitle = document.querySelector('.markdown-section h1');
            var isReadingNote = /^#\/docs\/(?:read|read-history)\//.test(window.location.hash);
            document.body.classList.toggle('reading-note-page', isReadingNote);
            document.querySelectorAll('.markdown-section > p').forEach(function (paragraph) {
              var isMetadata = /^\s*date\s*:/i.test(paragraph.textContent);
              paragraph.classList.toggle('reading-body-paragraph', isReadingNote && !isMetadata);
            });
            document.title = articleTitle
              ? articleTitle.textContent.trim() + ' · 丹的阅读笔记'
              : '丹的阅读笔记';
            document.querySelectorAll('.markdown-section a[href^="http"]').forEach(function (link) {
              if (link.hostname !== window.location.hostname) {
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
              }
            });
            document.dispatchEvent(new CustomEvent('doc-read:rendered'));
          });
        }
      ]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2.10.1/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-count@1.1.0/dist/countable.min.js"></script>
  <script src="./assets/js/site.js"></script>
  <script src="./assets/js/reading-dashboard.js"></script>
</body>

</html>
