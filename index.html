<body>

          <circle cx="16.4" cy="12.5" r="1.05" />
          <circle cx="18.1" cy="18" r=".9" />
          <circle cx="23.7" cy="18" r=".9" />

    <p id="typo-edit-note" class="typo-edit-note"></p>
    <div class="typo-dialog-actions">
      <button id="typo-dismiss" type="button">我知道了</button>

    </div>

  <div id="app">正在打开书房…</div>
  <noscript>这个网站需要启用 JavaScript 才能浏览阅读笔记。</noscript>

  <script>
    window.$docsify = {
      name: '丹的阅读笔记',
      nameLink: '#/',
      repo: 'https://github.com/firefly1984982452/doc-read',
      noEmoji: false,
      coverpage: true,
      onlyCover: false,
      loadSidebar: true,
      loadNavbar: true,
      mergeNavbar: true,
      subMaxLevel: 3,
      maxLevel: 4,
      auto2top: true,
      autoHeader: false,
      relativePath: false,
      notFoundPage: '404.md',
      topMargin: 32,
      count: {
        countable: true,
        fontsize: '0.82em',
        color: 'var(--text-muted)',
        language: 'chinese'
      },
      pagination: {
        previousText: '上一篇',
        nextText: '下一篇',
        crossChapter: true
      },
      plugins: [
        function (hook) {
          hook.beforeEach(function (markdown) {
            var route = (window.location.hash || '').split('?')[0].replace(/^#\//, '');
            try { route = decodeURIComponent(route); } catch (error) { /* Keep the encoded route. */ }
            window.DOC_READ_PAGE_SOURCE = {
              path: route ? route.replace(/\.md$/, '') + '.md' : '',
              markdown: markdown
            };
            return markdown;
          });
          hook.doneEach(function () {
            var articleTitle = document.querySelector('.markdown-section h1');
            var isReadingNote = /^#\/docs\/(?:read|read-history)\//.test(window.location.hash);
            document.body.classList.toggle('reading-note-page', isReadingNote);
            document.querySelectorAll('.markdown-section > p').forEach(function (paragraph) {
              var isMetadata = /^\s*date\s*:/i.test(paragraph.textContent);
              var containsImage = Boolean(paragraph.querySelector('img'));
              paragraph.classList.toggle('reading-image-paragraph', containsImage);
              paragraph.classList.toggle('reading-body-paragraph', isReadingNote && !isMetadata && !containsImage);
            });
            document.title = articleTitle
              ? articleTitle.textContent.trim() + ' · 丹的阅读笔记'
              : '丹的阅读笔记';
            document.querySelectorAll('.markdown-section a:not(.anchor)').forEach(function (link) {
              var href = link.getAttribute('href') || '';
              var isSamePageAnchor = href.charAt(0) === '#' && href.indexOf('#/') !== 0;
              var isPagination = Boolean(link.closest('.docsify-pagination-container, .pagination-item'));
              if (!href || isSamePageAnchor || isPagination) return;
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
            });
            document.dispatchEvent(new CustomEvent('doc-read:rendered'));
          });
        }
      ]
    };
  </script>
  <script src="./assets/vendor/docsify/docsify.min.js"></script>
